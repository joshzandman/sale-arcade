<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Store name</title>
    <style>
      html,
      body {
        margin: 0;
        font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
        background: #1c1c1e;
        color: #f5f5f7;
      }
      main {
        padding: 18px 20px 16px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #c7c7cc;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #3a3a3c;
        border-radius: 6px;
        background: #2c2c2e;
        color: #fff;
        font: inherit;
      }
      .row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        padding: 6px 14px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      .cancel {
        background: #3a3a3c;
        color: #fff;
      }
      .ok {
        background: #0a84ff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <label for="name">Store name</label>
      <input id="name" maxlength="40" />
      <div class="row">
        <button class="cancel" id="cancel">Cancel</button>
        <button class="ok" id="ok">Save</button>
      </div>
    </main>
    <script>
      const input = document.getElementById("name");
      window.promptApi.init((value) => {
        input.value = value || "";
        input.focus();
        input.select();
      });
      document.getElementById("ok").onclick = () => {
        window.promptApi.submit(input.value);
      };
      document.getElementById("cancel").onclick = () => {
        window.promptApi.cancel();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") window.promptApi.submit(input.value);
        if (e.key === "Escape") window.promptApi.cancel();
      });
    </script>
  </body>
</html>
